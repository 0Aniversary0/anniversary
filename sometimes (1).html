<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Happy 2 Months Anniversary!</title>
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffe6f0, #ffe0eb);
      font-family: 'Itim', cursive;
      text-align: center;
      color: #d6336c;
      overflow: hidden;
    }

    h1 {
      margin-top: 50px;
      font-size: 2.8em;
      animation: fadeIn 2.5s ease-in-out;
    }

    h2 {
      font-size: 2em;
      color: #ff66a3;
      animation: fadeIn 3s ease-in-out;
    }

    p {
      font-size: 1.5em;
      margin: 30px auto;
      width: 80%;
      animation: fadeIn 3.5s ease-in-out;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: pink;
      transform: rotate(45deg);
      animation: float 8s infinite ease-in-out;
      opacity: 0.7;
      filter: blur(0.5px);
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: pink;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(45deg);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-box {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      padding: 20px;
      width: 70%;
      margin: 0 auto;
      box-shadow: 0 4px 20px rgba(255, 182, 193, 0.4);
      animation: fadeIn 4s ease-in-out;
    }

    audio {
      margin-top: 30px;
    }
  
    .question-box {
      margin-top: 80px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 30px;
      width: 80%;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 4px 15px rgba(255, 182, 193, 0.5);
      animation: fadeIn 2s ease-in-out;
    }

    .question-box input {
      font-size: 1.2em;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ff85a1;
      width: 80%;
      text-align: center;
    }

    .question-box button {
      background-color: #ff85a1;
      color: white;
      font-size: 1em;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .question-box button:hover {
      background-color: #ff5f91;
    }

</style>
</head>
<body>

  <div id="quiz" class="question-box">
    <h2>ตอบคำถามก่อนน้า 💕</h2>
    <p>วันครบรอบของเราคือวันอะไร 💌</p>
    <input type="text" id="answer" placeholder="ตัวอย่าง: 01/01/2025">
    <br><br>
    <button onclick="checkAnswer()">ส่งคำตอบ</button>
  </div>

  <script>
    function checkAnswer() {
      const correctAnswer = "14/02/2025";
      const userAnswer = document.getElementById("answer").value.trim();
      if (userAnswer === correctAnswer) {
        document.getElementById("quiz").style.display = "none";
        document.getElementById("main-content").style.display = "block";
      } else {
        alert("ยังไม่ถูกน้า ลองใหม่อีกทีน้า 💗");
      }
    }
  </script>

<div id="main-content" style="display:none;">
  <h1>สุขสันต์วันครบรอบค้าบ 💖</h1>
  <h2>อยู่ด้วยกันมา 2 เดือนแล้วนะ!</h2>

  <div class="message-box">
    <p>เย้ๆ ครบ2เดือนแล้ว ดื้อให้มันน้อยๆลงหน่อย<br>
ขอบคุณนะที่ยังอยู่ด้วยกัน 💗</p>
  </div>

  
  <!-- เพลงน่ารักๆ -->
  <audio controls>
    <source src="tikkatok.mp3" type="audio/mp3">
    เบราว์เซอร์คุณไม่รองรับเสียงนะครับ
  </audio>


  <!-- หัวใจลอย -->
  <script>
    const heartCount = 50;
    const colors = ['#ffb6c1', '#ffc0cb', '#ff69b4', '#ff85a1', '#ffa6c9'];
    for (let i = 0; i < heartCount; i++) {
      let heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
      heart.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      heart.style.opacity = Math.random() * 0.5 + 0.5;
      document.body.appendChild(heart);
    }
  </script>
</body>
</html>
</div>
